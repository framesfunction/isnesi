project_id = "isnesi"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = false

[auth.email]
# Email provider stays enabled so staff can sign in with email + password.
# New public sign-ups are blocked globally via `[auth] enable_signup = false`;
# staff accounts are created via Dashboard invites or the admin flow.
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
